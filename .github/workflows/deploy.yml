name: Deploy to S3

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync immutable assets to S3 (long cache)
        run: |
          aws s3 sync dist/ s3://gene-t-taylor.com --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "*.html" --exclude "*.xml" --exclude "*.txt" --exclude "*.json"

      - name: Sync HTML/XML/text content to S3 (short cache)
        run: |
          aws s3 sync dist/ s3://gene-t-taylor.com \
            --cache-control "max-age=3600" \
            --exclude "*" --include "*.html" --include "*.xml" --include "*.txt" --include "*.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
