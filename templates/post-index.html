$partial("templates/includes/head-dark.html")

    <div id='bump'>
        <section class="article archive">
          <article class="archive-wrap">
              <ol class="post-list">
                 <lh><h2><span class="bb">$title$</span></h2></lh>
                  $for(site.posts)
                  <li>
                    <div class="deets" itemscope itemtype="http://schema.org/BlogPosting" itemprop="blogPost">
                        <h1><a href="$site.url$ $post.url$">$post.title$</a></h1>
                        <p class="date"><time datetime="$page.date$" itemprop="datePublished">$page.date$</time></p>
                        <p class="">$if(post.description$ $post.description$ $else$ $post.content$ $endif$</p>
                    </div>
                  </li>
                  $endfor$
              </ol>
          </article>
        </section>
    </div>

$partial("templates/includes/footer.html")$
